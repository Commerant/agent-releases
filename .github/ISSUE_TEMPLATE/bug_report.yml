name: Question or problem
description: Report a problem or ask a question about a released version
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not post API keys, passwords, `config.toml` contents or business data.
  - type: input
    id: version
    attributes:
      label: Agent version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options: [directory, exact-rest]
  - type: dropdown
    id: service
    attributes:
      label: Runs as Windows service
      options: ["Yes", "No"]
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Remove customer names, credentials and file contents first.
      render: text
